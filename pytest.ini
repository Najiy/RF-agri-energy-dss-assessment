[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    integration: uses the real EuroCrops PT.zip in data/ (skipped when absent)
    network: calls the live NASA POWER API (skipped when unreachable)
filterwarnings =
    error::DeprecationWarning:dss_pipeline
    error::FutureWarning:dss_pipeline
